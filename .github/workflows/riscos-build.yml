# A port's build on GitHub, in the riscos-crossdev container image.
# Copy to .github/workflows/riscos-build.yml in your repository. The image
# is the one for the riscos-crossdev release named in .riscos-deps at the
# top of the repository (a line `riscos-crossdev v1.8`; see
# riscos-deps-update.yml). Change BUILD to your build and test command, and
# ARTIFACTS to what it makes. PACKAGES: Ubuntu packages your build needs
# that the image hasn't (docker/Dockerfile lists what it has); set the same
# in riscos-deps-update.yml.
#
# From riscos-crossdev's ci/ (docs/CI.md). MIT licence.
name: RISC OS build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # fetch the sources and the devkit .riscos-deps names, build the libraries
  # and fheroes2, run the checks (package.sh: UnixLib ticker block, stack
  # probes, build paths, and riscos-crossdev's check-all) and make the zip,
  # then the host test of the present path (ASan/UBSan)
  BUILD: build/prepare-toolchain.sh && build/build-deps.sh && build/build-fheroes2.sh unpack && build/package.sh && tests/present/run.sh
  ARTIFACTS: dist/*.zip
  # msgfmt for the translations; PIL for the icon sprites
  PACKAGES: "gettext python3-pil"

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: |
          v=$(awk '$1 == "riscos-crossdev" || $1 == "adyoull/riscos-crossdev" {sub(/^v/, "", $2); print $2}' .riscos-deps)
          [ -n "$v" ] || { echo ".riscos-deps has no riscos-crossdev line" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: pin
    runs-on: ubuntu-24.04
    container: ghcr.io/adyoull/riscos-crossdev:${{ needs.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Packages this port needs
        if: env.PACKAGES != ''
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends $PACKAGES
      - name: Downloaded sources (about 40 MB, the same until build/SHA256SUMS.txt changes)
        uses: actions/cache@v4
        with:
          path: dl
          key: riscos-fheroes2-dl-${{ hashFiles('build/SHA256SUMS.txt') }}
      - name: Build, check and test
        run: ${{ env.BUILD }}
      - uses: actions/upload-artifact@v7
        with:
          name: riscos-build
          path: ${{ env.ARTIFACTS }}
          if-no-files-found: warn
